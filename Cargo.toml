[package]
name = "web-push"
description = "Web push notification client with support for http-ece encryption and VAPID authentication."
version = "0.11.0"
authors = ["Julius de Bruijn <julius+github@nauk.io>", "Andrew Ealovega <Andrew@Ealovega.dev>"]
license = "Apache-2.0"
homepage = "https://github.com/pimeys/rust-web-push"
repository = "https://github.com/pimeys/rust-web-push"
documentation = "https://docs.rs/web-push/"
readme = "README.md"
keywords = ["web-push", "http-ece", "vapid"]
categories = ["web-programming", "asynchronous"]
rust-version = "1.80"
edition = "2021"

[features]
default = ["hyper-client"]
hyper-client = ["hyper", "hyper-tls", "hyper-util", "http-body-util"]
hyper-rustls-client = ["hyper", "hyper-rustls", "hyper-util", "http-body-util"]

[dependencies]
hyper = { version = "1.7", optional = true }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-tls = { version = "0.6", optional = true, features = ["alpn"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "logging", "aws-lc-rs", "rustls-platform-verifier"], optional = true }
http = "1.3"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
ece = { version = "2.3.1", default-features = false }
aws-lc-rs = "1.18.0"
p256 = "0.14"
chrono = "0.4"
log = "0.4"
base64ct = "1.8.3"

[dev-dependencies]
regex = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
